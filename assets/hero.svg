<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050816"/><stop offset=".52" stop-color="#0b1930"/><stop offset="1" stop-color="#06151f"/>
  </linearGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop stop-color="#00f7ff"/><stop offset=".5" stop-color="#7c5cff"/><stop offset="1" stop-color="#00f7ff"/>
  </linearGradient>
  <radialGradient id="orb"><stop stop-color="#00f7ff" stop-opacity=".30"/><stop offset="1" stop-color="#00f7ff" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#58a6ff" stroke-opacity=".08"/>
  </pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="25"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
  <clipPath id="clip"><rect width="1200" height="360" rx="28"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <circle cx="140" cy="55" r="220" fill="url(#orb)" filter="url(#blur)">
    <animate attributeName="cx" values="140;300;140" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="55;140;55" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1060" cy="300" r="250" fill="url(#orb)" filter="url(#blur)">
    <animate attributeName="cx" values="1060;900;1060" dur="12s" repeatCount="indefinite"/>
  </circle>

  <g opacity=".7" fill="#8be9fd">
    <circle cx="85" cy="270" r="1.5"><animate attributeName="opacity" values=".15;1;.15" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="245" cy="80" r="1.2"><animate attributeName="opacity" values="1;.15;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="390" cy="300" r="1.5"><animate attributeName="opacity" values=".15;1;.15" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="70" r="1.3"><animate attributeName="opacity" values="1;.15;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="855" cy="290" r="1.5"><animate attributeName="opacity" values=".15;1;.15" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="105" r="1.3"><animate attributeName="opacity" values="1;.15;1" dur="3.3s" repeatCount="indefinite"/></circle>
  </g>

  <path d="M-120 285 C160 180 350 365 590 250 S1000 135 1320 235" fill="none" stroke="url(#line)" stroke-opacity=".22" stroke-width="2" stroke-dasharray="12 18">
    <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M-120 300 C160 195 350 380 590 265 S1000 150 1320 250" fill="none" stroke="#00f7ff" stroke-opacity=".08" stroke-width="10" filter="url(#glow)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="142" font-size="48" font-weight="800" fill="#fff">Yatham Sridhar Reddy</text>
    <rect x="445" y="165" width="310" height="2" rx="1" fill="url(#line)">
      <animate attributeName="width" values="160;310;160" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="520;445;520" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="600" y="210" font-size="20" font-weight="600" fill="#b9d9ff">Cloud • DevOps • Backend • Full Stack</text>
    <text x="600" y="245" font-size="14" fill="#7f9dbb">AWS  •  OCI  •  Docker  •  Linux  •  CI/CD  •  Python</text>
  </g>

  <g transform="translate(82 54)" opacity=".72">
    <rect width="190" height="42" rx="21" fill="#08111f" stroke="#00f7ff" stroke-opacity=".38"/>
    <circle cx="25" cy="21" r="5" fill="#00f7ff"><animate attributeName="r" values="4;7;4" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="45" y="26" font-family="monospace" font-size="13" fill="#b9d9ff">BUILD / SHIP / SCALE</text>
  </g>

  <g transform="translate(928 54)" opacity=".72">
    <rect width="190" height="42" rx="21" fill="#08111f" stroke="#7c5cff" stroke-opacity=".45"/>
    <circle cx="25" cy="21" r="5" fill="#7c5cff"><animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/></circle>
    <text x="45" y="26" font-family="monospace" font-size="13" fill="#b9d9ff">CLOUD / CODE / OPS</text>
  </g>
</g>
</svg>
